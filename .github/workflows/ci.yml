name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: go vet
        run: go vet ./...
      - name: go vet (windows)
        run: GOOS=windows go vet ./...
      - uses: dominikh/staticcheck-action@v1
        with:
          install-go: false
      - uses: bufbuild/buf-action@v1
        with:
          setup_only: true
      - name: generated code is current
        run: |
          go generate ./...
          git diff --exit-code

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        race: [""]
        include:
          - os: ubuntu-latest
            race: -race
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      # Both modes run: timing-dependent bugs have shown up only without -race.
      - name: go test ${{ matrix.race }}
        run: go test ${{ matrix.race }} -count=1 ./...
